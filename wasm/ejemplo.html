<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WASM vs JavaScript</title>
  <meta name="description" content="Demostración de WebAssembly nativo escrito a mano comparado con JavaScript.">
  <link rel="stylesheet" href="ejemplo.css">
</head>
<body>

  <header>
    <h1>WASM vs JavaScript</h1>
    <p>Comparativa de rendimiento en tiempo real entre WebAssembly nativo (WAT) y JavaScript.</p>
  </header>

  <main>
    <section>
      <h2>Selecciona una operación</h2>

      <menu role="tablist" class="tabs">
        <li role="presentation"><button type="button" id="tab-0" role="tab" class="tab-btn active" aria-selected="true" aria-controls="panel-0" onclick="cambiarOperacion('factorial', 0)">Factorial (n!)</button></li>
        <li role="presentation"><button type="button" id="tab-1" role="tab" class="tab-btn" aria-selected="false" aria-controls="panel-1" onclick="cambiarOperacion('coseno', 1)">Coseno Taylor</button></li>
        <li role="presentation"><button type="button" id="tab-2" role="tab" class="tab-btn" aria-selected="false" aria-controls="panel-2" onclick="cambiarOperacion('primo', 2)">Número primo</button></li>
      </menu>

      <p class="prueba-activa" aria-live="polite">
        Prueba seleccionada: <strong id="nombre-prueba">Factorial (n!)</strong>
      </p>

      <form onsubmit="return false;">
        <p id="panel-0" role="tabpanel" aria-labelledby="tab-0">
          <label>n (1 a 20)
            <br>
            <input type="number" value="15" min="1" max="20">
          </label>
        </p>
        <p id="panel-1" role="tabpanel" aria-labelledby="tab-1" hidden>
          <label>x (en radianes)
            <br>
            <input type="number" value="1.0472" step="0.01">
          </label>
        </p>
        <p id="panel-2" role="tabpanel" aria-labelledby="tab-2" hidden>
          <label>Número a comprobar
            <br>
            <input type="number" value="982451653" min="2">
          </label>
        </p>
        <button type="button" onclick="ejecutar()">Ejecutar</button>
      </form>

      <table>
        <thead>
          <tr>
            <th scope="col">WebAssembly</th>
            <th scope="col">JavaScript</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>-</td>
            <td>-</td>
          </tr>
          <tr>
            <td></td>
            <td></td>
          </tr>
        </tbody>
      </table>

      <output></output>
    </section>

    <section>
      <h2>Código fuente WAT</h2>
      <pre></pre>
    </section>
  </main>

  <script src="ejemplo.js"></script>
</body>
</html>
