<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-label="Avatar de desarrollador de software" role="img">
  <defs>
    <linearGradient id="devBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="devGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#06b6d4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#devBg)" stroke="url(#cyanGrad)" stroke-width="6"/>

  <!-- Code brackets in background -->
  <text x="50" y="160" font-family="monospace" font-size="48" font-weight="bold" fill="#06b6d4" opacity="0.25">&lt;/&gt;</text>
  <text x="300" y="270" font-family="monospace" font-size="44" font-weight="bold" fill="#10b981" opacity="0.2">{;}</text>

  <!-- Head -->
  <circle cx="200" cy="155" r="54" fill="#cbd5e1"/>

  <!-- Tech Glasses / HUD -->
  <rect x="170" y="145" width="24" height="14" rx="3" fill="#0284c7" opacity="0.9"/>
  <rect x="206" y="145" width="24" height="14" rx="3" fill="#0284c7" opacity="0.9"/>
  <line x1="194" y1="152" x2="206" y2="152" stroke="#0284c7" stroke-width="3"/>
  <line x1="160" y1="150" x2="170" y2="152" stroke="#0284c7" stroke-width="2"/>
  <line x1="230" y1="152" x2="240" y2="150" stroke="#0284c7" stroke-width="2"/>

  <!-- Torso with hoodie -->
  <path d="M110 320 C110 240, 150 220, 200 220 C250 220, 290 240, 290 320 C290 350, 255 365, 200 365 C145 365, 110 350, 110 320 Z" fill="url(#cyanGrad)" filter="url(#devGlow)"/>

  <!-- Hoodie collar & zipper -->
  <path d="M175 220 Q200 260 225 220" fill="none" stroke="#0f172a" stroke-width="6"/>
  <line x1="200" y1="248" x2="200" y2="340" stroke="#0f172a" stroke-width="4"/>
</svg>
