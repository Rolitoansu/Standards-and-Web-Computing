<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-label="Avatar de diseñador y creativo" role="img">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29"/>
      <stop offset="100%" stop-color="#2d124d"/>
    </linearGradient>
    <linearGradient id="violetPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="artGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#artBg)" stroke="url(#violetPink)" stroke-width="6"/>

  <!-- Geometric creative elements -->
  <polygon points="60,110 80,75 100,110" fill="#fbbf24" opacity="0.4"/>
  <circle cx="330" cy="130" r="18" fill="#38bdf8" opacity="0.35"/>
  <rect x="310" y="270" width="30" height="30" rx="6" fill="#a855f7" opacity="0.3" transform="rotate(25 325 285)"/>

  <!-- Head -->
  <circle cx="200" cy="155" r="54" fill="#e2e8f0"/>

  <!-- Designer glasses (stylish round) -->
  <circle cx="180" cy="150" r="14" fill="none" stroke="#6b21a8" stroke-width="4"/>
  <circle cx="220" cy="150" r="14" fill="none" stroke="#6b21a8" stroke-width="4"/>
  <line x1="194" y1="150" x2="206" y2="150" stroke="#6b21a8" stroke-width="3"/>

  <!-- Torso stylish jacket -->
  <path d="M110 320 C110 240, 150 220, 200 220 C250 220, 290 240, 290 320 C290 350, 255 365, 200 365 C145 365, 110 350, 110 320 Z" fill="url(#violetPink)" filter="url(#artGlow)"/>

  <!-- Scarf / Creative lapel -->
  <path d="M185 220 C190 250, 195 270, 195 310 L205 310 C205 270, 210 250, 215 220 Z" fill="url(#goldGrad)"/>
</svg>
