<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%" aria-label="Mockup genérico de proyecto tecnológico" role="img">
  <defs>
    <linearGradient id="projBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="winShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="380" rx="16" fill="url(#projBg)"/>

  <!-- Subtle grid pattern -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="95" x2="600" y2="95"/>
    <line x1="0" y1="190" x2="600" y2="190"/>
    <line x1="0" y1="285" x2="600" y2="285"/>
    <line x1="150" y1="0" x2="150" y2="380"/>
    <line x1="300" y1="0" x2="300" y2="380"/>
    <line x1="450" y1="0" x2="450" y2="380"/>
  </g>

  <!-- Window Container -->
  <g filter="url(#winShadow)">
    <rect x="40" y="35" width="520" height="310" rx="10" fill="#0b1120" stroke="#475569" stroke-width="2"/>

    <!-- Window Header -->
    <rect x="40" y="35" width="520" height="36" rx="10" fill="#1e293b"/>
    <rect x="40" y="60" width="520" height="11" fill="#1e293b"/>
    <circle cx="65" cy="53" r="6" fill="#ef4444"/>
    <circle cx="85" cy="53" r="6" fill="#f59e0b"/>
    <circle cx="105" cy="53" r="6" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="135" y="44" width="280" height="18" rx="4" fill="#0f172a"/>
    <text x="145" y="57" font-family="monospace" font-size="11" fill="#94a3b8">https://proyecto.local/app</text>

    <!-- Sidebar in app -->
    <rect x="40" y="71" width="110" height="274" fill="#0f172a" opacity="0.8"/>
    <rect x="55" y="90" width="80" height="12" rx="3" fill="#38bdf8" opacity="0.7"/>
    <rect x="55" y="112" width="65" height="10" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="55" y="130" width="70" height="10" rx="3" fill="#64748b" opacity="0.5"/>
    <rect x="55" y="148" width="55" height="10" rx="3" fill="#64748b" opacity="0.5"/>

    <!-- Dashboard Content -->
    <!-- Metric cards -->
    <rect x="170" y="90" width="110" height="60" rx="6" fill="url(#cardGrad)"/>
    <rect x="180" y="100" width="40" height="8" rx="2" fill="#94a3b8"/>
    <rect x="180" y="115" width="60" height="16" rx="3" fill="url(#barGrad)"/>

    <rect x="295" y="90" width="110" height="60" rx="6" fill="url(#cardGrad)"/>
    <rect x="305" y="100" width="45" height="8" rx="2" fill="#94a3b8"/>
    <rect x="305" y="115" width="50" height="16" rx="3" fill="#10b981"/>

    <rect x="420" y="90" width="115" height="60" rx="6" fill="url(#cardGrad)"/>
    <rect x="430" y="100" width="50" height="8" rx="2" fill="#94a3b8"/>
    <rect x="430" y="115" width="75" height="16" rx="3" fill="#f59e0b"/>

    <!-- Graph / Chart visualization -->
    <rect x="170" y="165" width="365" height="155" rx="6" fill="#111827"/>
    <polyline points="190,290 230,240 280,260 340,210 400,230 460,185 510,195" fill="none" stroke="url(#barGrad)" stroke-width="4"/>
    <circle cx="340" cy="210" r="5" fill="#38bdf8"/>
    <circle cx="460" cy="185" r="5" fill="#6366f1"/>
    <circle cx="510" cy="195" r="5" fill="#a855f7"/>
  </g>
</svg>
