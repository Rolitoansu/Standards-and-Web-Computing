<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%" aria-label="Ilustración genérica de intereses y aficiones" role="img">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="450" rx="16" fill="url(#skyGrad)"/>

  <!-- Sun / Horizon Moon -->
  <circle cx="300" cy="220" r="75" fill="url(#sunGrad)" opacity="0.85"/>

  <!-- Stars -->
  <circle cx="80" cy="70" r="2" fill="#fff" opacity="0.8"/>
  <circle cx="150" cy="120" r="1.5" fill="#fff" opacity="0.6"/>
  <circle cx="480" cy="80" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="520" cy="140" r="1.5" fill="#fff" opacity="0.9"/>
  <circle cx="230" cy="60" r="1.5" fill="#fff" opacity="0.5"/>
  <circle cx="390" cy="95" r="2" fill="#fff" opacity="0.8"/>

  <!-- Background Mountains -->
  <polygon points="50,380 200,180 340,380" fill="url(#mountain1)" opacity="0.7"/>
  <polygon points="260,380 420,160 560,380" fill="url(#mountain1)" opacity="0.7"/>

  <!-- Foreground Mountains -->
  <polygon points="-40,450 140,240 320,450" fill="url(#mountain2)"/>
  <polygon points="180,450 350,220 520,450" fill="url(#mountain2)"/>
  <polygon points="380,450 500,290 640,450" fill="url(#mountain2)"/>

  <!-- Foreground Landscape Line -->
  <rect x="0" y="420" width="600" height="30" fill="#0f172a"/>

  <!-- Camera / Technology subtle icon badge -->
  <g transform="translate(480, 50)">
    <rect width="70" height="50" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2" opacity="0.9"/>
    <circle cx="35" cy="25" r="14" fill="none" stroke="#38bdf8" stroke-width="3"/>
    <circle cx="35" cy="25" r="7" fill="#38bdf8"/>
    <circle cx="52" cy="15" r="3" fill="#f59e0b"/>
  </g>
</svg>
