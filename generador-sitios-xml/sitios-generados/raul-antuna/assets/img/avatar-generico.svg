<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" aria-label="Avatar profesional genérico" role="img">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="avatarSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="200" cy="200" r="190" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="6"/>

  <!-- Halo glow -->
  <circle cx="200" cy="170" r="80" fill="url(#accentGrad)" opacity="0.15" filter="url(#shadow)"/>

  <!-- Head -->
  <circle cx="200" cy="155" r="55" fill="url(#avatarSkin)"/>

  <!-- Torso / Shoulders -->
  <path d="M110 320 C110 245, 150 225, 200 225 C250 225, 290 245, 290 320 C290 345, 260 365, 200 365 C140 365, 110 345, 110 320 Z" fill="url(#accentGrad)" filter="url(#shadow)"/>

  <!-- Tie / Collar detail -->
  <path d="M185 225 L200 250 L215 225 Z" fill="#ffffff" opacity="0.9"/>
  <path d="M195 245 L205 245 L203 285 L197 285 Z" fill="#ffffff" opacity="0.75"/>
</svg>
